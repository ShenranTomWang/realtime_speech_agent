roles:
  frontend: qwen35_frontend
  backend: vector
runners:
  qwen35_frontend:
    model: Qwen/Qwen3.5-4B
    base_url: http://127.0.0.1:8011/v1
    launch:
      environment: soulx-llm
      command:
      - vllm
      - serve
      - Qwen/Qwen3.5-4B
      - --served-model-name
      - Qwen/Qwen3.5-4B
      - --host
      - 127.0.0.1
      - --port
      - '8011'
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --max-model-len
      - '16384'
      - --max-num-seqs
      - '2'
      - --gpu-memory-utilization
      - '0.35'
  vector:
    model: Qwen3_8-27B
    base_url: https://proxy.vectorinstitute.ai/v1
    api_key_env: VECTOR_KEY
