roles:
  frontend: local
  backend: local
runners:
  local:
    model: local-llm
    base_url: http://127.0.0.1:8011/v1
    launch:
      environment: soulx-llm
      command:
      - vllm
      - serve
      - Qwen/Qwen3-4B-Instruct-2507
      - --served-model-name
      - local-llm
      - --host
      - 127.0.0.1
      - --port
      - '8011'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --max-model-len
      - '8192'
      - --gpu-memory-utilization
      - '0.3'
