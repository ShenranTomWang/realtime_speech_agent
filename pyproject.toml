[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soulx-audio-agent"
version = "0.1.0"
description = "SoulX full-duplex foreground/background agents with Claude Code and configurable LLM runners"
requires-python = ">=3.11,<3.14"
dependencies = [
    "claude-agent-sdk>=0.1.0,<0.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "websockets>=14,<17",
    "numpy>=1.26,<3",
    "soxr>=0.5,<2",
    "soundfile>=0.12,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
gateway = ["litellm[proxy]>=1.80,<2"]

[tool.setuptools.packages.find]
include = ["soulx_agent*", "scripts*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
